lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/channel-cdp:
    dependencies:
      '@bigfish/core':
        specifier: workspace:*
        version: link:../core

  packages/channel-guanjia:
    dependencies:
      '@bigfish/core':
        specifier: workspace:*
        version: link:../core

  packages/channel-mtop:
    dependencies:
      '@bigfish/core':
        specifier: workspace:*
        version: link:../core

  packages/core: {}

  packages/daemon:
    dependencies:
      '@bigfish/channel-cdp':
        specifier: workspace:*
        version: link:../channel-cdp
      '@bigfish/channel-mtop':
        specifier: workspace:*
        version: link:../channel-mtop
      '@bigfish/core':
        specifier: workspace:*
        version: link:../core

  packages/ops-bundle:
    dependencies:
      '@bigfish/plugin-ops':
        specifier: workspace:*
        version: link:../plugin-ops

  packages/plugin-ops: {}
